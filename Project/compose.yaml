services:
  backend:
    build:
      context: ./backend/crash-analytics-api
      dockerfile: Dockerfile
    container_name: crash-analytics-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/crash_analytics_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crash-analytics-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped