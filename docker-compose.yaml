services:
  backend:
    build:
      context: ./backend/crash-analytics-api
      dockerfile: Dockerfile
    container_name: crash-analytics-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://${DB_HOST}:3306/crash_analytics_db
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crash-analytics-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped